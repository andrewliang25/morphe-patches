name: 🐞 Bug report
description: Report a bug or an issue.
title: "bug: "
labels: ["Bug report"]
body:
  - type: markdown
    attributes:
      value: |
        # Andrew's Patches bug report

        Before creating a new bug report, please keep the following in mind:

        - **Do not submit a duplicate bug report**: Search for existing bug reports [here](https://github.com/andrewliang25/morphe-patches/issues?q=label%3A%22Bug+report%22).
  - type: input
    id: app-version
    attributes:
      label: App and version
      description: The patched app and its version.
      placeholder: "LINE 26.14.0"
    validations:
      required: true
  - type: input
    id: bundle-version
    attributes:
      label: Bundle version
      description: The version of Andrew's Patches that you applied.
      placeholder: "v3.3.2-dev.1"
    validations:
      required: true
  - type: dropdown
    id: installation-mode
    attributes:
      label: Installation mode
      description: How you installed the patched app. Standard signs the app again. Root Mount keeps the original signature.
      options:
        - Standard
        - Root Mount
    validations:
      required: true
  - type: textarea
    id: patches-applied
    attributes:
      label: Patches applied
      description: List all the patches that you applied, not only the patch with the bug.
      placeholder: |
        - [Ad] Remove banner ads
        - [Chat] Keep unsent messages
    validations:
      required: true
  - type: textarea
    attributes:
      label: Bug description
      description: |
        - Describe your bug in detail
        - Add steps to reproduce the bug if possible (Step 1. ... Step 2. ...)
        - Add images and videos if possible
    validations:
      required: true
  - type: textarea
    attributes:
      label: Error logs
      description: Exceptions can be captured by running `logcat | grep AndroidRuntime` in a shell.
      render: shell
  - type: textarea
    attributes:
      label: Solution
      description: If applicable, add a possible solution to the bug.
  - type: textarea
    attributes:
      label: Additional context
      description: Add additional context here.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your bug report will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed bug reports and this is not a duplicate.
          required: true
        - label: I have chosen an appropriate title.
          required: true
        - label: All requested information has been provided properly.
          required: true
